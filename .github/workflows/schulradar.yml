name: Schulradar

on:
  push:
    branches: ['**']
    paths:
      - 'schulradar/**'
      - '.github/workflows/schulradar.yml'
    tags:
      - 'schulradar-v*'
  pull_request:
    paths:
      - 'schulradar/**'
      - '.github/workflows/schulradar.yml'
  workflow_dispatch:
    inputs:
      release:
        description: 'GitHub-Release erstellen (Tag schulradar-v<Version aus package.json>)'
        type: boolean
        default: false

permissions:
  contents: write

defaults:
  run:
    working-directory: schulradar

jobs:
  test:
    name: Tests (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: schulradar/package-lock.json
      - run: npm ci
      - name: Unit-Tests
        run: npm test
        env:
          TZ: Europe/Vienna
      - name: Ende-zu-Ende-Test (App gegen nachgebaute Plattformen)
        run: npm run test:e2e

  windows:
    name: Windows-Installer
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: schulradar/package-lock.json
      - run: npm ci
      - name: Unit-Tests
        run: npm test
      - name: Ende-zu-Ende-Test unter Windows
        run: npm run test:e2e
      - name: Installer bauen
        run: npm run dist
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: Schulradar-Windows
          path: |
            schulradar/dist/Schulradar-Setup-*.exe
            schulradar/dist/Schulradar-*-portable.exe
          if-no-files-found: error
      - name: Release veröffentlichen
        if: startsWith(github.ref, 'refs/tags/schulradar-v') || inputs.release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="$GITHUB_REF_NAME"
          [[ "$GITHUB_REF" == refs/tags/* ]] || TAG="schulradar-v$(node -p "require('./package.json').version")"
          # legt Release und Tag auf GitHub an (auch ohne vorher gepushten Tag)
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --target "$GITHUB_SHA" --title "Schulradar ${TAG#schulradar-v}" --notes-file RELEASE.md || true
          for i in 1 2 3; do gh release upload "$TAG" dist/Schulradar-*.exe --clobber && break; sleep 15; done

  android:
    name: Android-App (APK)
    needs: test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: schulradar/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: schulradar/mobile/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
      - run: npm ci
      - name: Oberfläche und Kern bündeln
        run: node build.mjs --minify
      - name: Android-Projekt aktualisieren
        run: npx cap sync android
      - name: Signaturschlüssel bereitstellen
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEY_PASS: ${{ secrets.SCHULRADAR_SCHLUESSEL }}
          WANT_RELEASE: ${{ startsWith(github.ref, 'refs/tags/schulradar-v') || inputs.release }}
        run: |
          FILE="$RUNNER_TEMP/schulradar-release.p12"
          check() { keytool -list -storetype PKCS12 -keystore "$FILE" -storepass schulradar -alias schulradar > /dev/null 2>&1; }
          OK=false
          # Weg 1 (empfohlen): verschlüsselter Schlüssel im Repository + kurzes Passwort als Secret SCHULRADAR_SCHLUESSEL
          KEY_PASS=$(printf '%s' "$KEY_PASS" | tr -d ' \r\n\t')
          if [ -n "$KEY_PASS" ]; then
            export KEY_PASS
            if openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -in android/app/schulradar-release.p12.enc -out "$FILE" -pass env:KEY_PASS 2> /dev/null && check; then
              OK=true
            else
              echo "::warning::Secret SCHULRADAR_SCHLUESSEL passt nicht (${#KEY_PASS} Zeichen, erwartet 24 im Format xxxx-xxxx-xxxx-xxxx-xxxx)."
            fi
          fi
          # Weg 2: kompletter Schlüssel als Base64 im Secret ANDROID_KEYSTORE_BASE64
          if [ "$OK" = false ] && [ -n "$KEYSTORE_B64" ]; then
            CLEAN=$(printf '%s' "$KEYSTORE_B64" | tr -d ' \r\n\t')
            if printf '%s' "$CLEAN" | base64 -d > "$FILE" 2> /dev/null && check; then
              OK=true
            else
              echo "::warning::Secret ANDROID_KEYSTORE_BASE64 ist unvollständig oder beschädigt (${#CLEAN} Zeichen, erwartet 3544)."
            fi
          fi
          if [ "$OK" = true ]; then
            echo "SCHULRADAR_KEYSTORE=$FILE" >> "$GITHUB_ENV"
            echo "APK wird mit dem Schulradar-Schlüssel signiert:"
            keytool -list -v -storetype PKCS12 -keystore "$FILE" -storepass schulradar -alias schulradar | grep -i 'SHA256:'
          elif [ "$WANT_RELEASE" = "true" ]; then
            echo "::error::Kein gültiger Signaturschlüssel. Bitte das Secret SCHULRADAR_SCHLUESSEL (Settings → Secrets and variables → Actions) mit dem 24-stelligen Passwort anlegen."
            exit 1
          else
            echo "::warning::Kein Signaturschlüssel – die APK wird nur mit einem Test-Schlüssel signiert und lässt sich nicht als Update installieren."
          fi
      - name: APK bauen
        working-directory: schulradar/mobile/android
        run: ./gradlew assembleRelease --no-daemon --stacktrace
      - name: APK benennen
        run: |
          VERSION=$(node -p "require('../package.json').version")
          mkdir -p dist
          cp android/app/build/outputs/apk/release/app-release.apk "dist/Schulradar-$VERSION.apk"
          ls -l dist
      - uses: actions/upload-artifact@v4
        with:
          name: Schulradar-Android
          path: schulradar/mobile/dist/Schulradar-*.apk
          if-no-files-found: error
      - name: Release veröffentlichen
        if: startsWith(github.ref, 'refs/tags/schulradar-v') || inputs.release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="$GITHUB_REF_NAME"
          [[ "$GITHUB_REF" == refs/tags/* ]] || TAG="schulradar-v$(node -p "require('../package.json').version")"
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --target "$GITHUB_SHA" --title "Schulradar ${TAG#schulradar-v}" --notes-file ../RELEASE.md || true
          for i in 1 2 3; do gh release upload "$TAG" dist/Schulradar-*.apk --clobber && break; sleep 15; done
