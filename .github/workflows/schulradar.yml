name: Schulradar

on:
  push:
    branches: ['**']
    paths:
      - 'schulradar/**'
      - '.github/workflows/schulradar.yml'
    tags:
      - 'schulradar-v*'
  pull_request:
    paths:
      - 'schulradar/**'
      - '.github/workflows/schulradar.yml'
  workflow_dispatch:

permissions:
  contents: write

defaults:
  run:
    working-directory: schulradar

jobs:
  test:
    name: Tests (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: schulradar/package-lock.json
      - run: npm ci
      - name: Unit-Tests
        run: npm test
        env:
          TZ: Europe/Vienna
      - name: Ende-zu-Ende-Test (App gegen nachgebaute Plattformen)
        run: npm run test:e2e

  windows:
    name: Windows-Installer
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: schulradar/package-lock.json
      - run: npm ci
      - name: Unit-Tests
        run: npm test
      - name: Ende-zu-Ende-Test unter Windows
        run: npm run test:e2e
      - name: Installer bauen
        run: npm run dist
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: Schulradar-Windows
          path: |
            schulradar/dist/Schulradar-Setup-*.exe
            schulradar/dist/Schulradar-*-portable.exe
          if-no-files-found: error
      - name: Release veröffentlichen
        if: startsWith(github.ref, 'refs/tags/schulradar-v')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --title "Schulradar ${GITHUB_REF_NAME#schulradar-v}" --notes "PC: Schulradar-Setup-…exe (Installer) oder die portable Version. Handy (Android): Schulradar-…apk. Anleitung: siehe schulradar/README.md." || true
          gh release upload "$GITHUB_REF_NAME" dist/Schulradar-*.exe --clobber

  android:
    name: Android-App (APK)
    needs: test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: schulradar/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: schulradar/mobile/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
      - run: npm ci
      - name: Oberfläche und Kern bündeln
        run: node build.mjs --minify
      - name: Android-Projekt aktualisieren
        run: npx cap sync android
      - name: APK bauen
        working-directory: schulradar/mobile/android
        run: ./gradlew assembleRelease --no-daemon --stacktrace
      - name: APK benennen
        run: |
          VERSION=$(node -p "require('../package.json').version")
          mkdir -p dist
          cp android/app/build/outputs/apk/release/app-release.apk "dist/Schulradar-$VERSION.apk"
          ls -l dist
      - uses: actions/upload-artifact@v4
        with:
          name: Schulradar-Android
          path: schulradar/mobile/dist/Schulradar-*.apk
          if-no-files-found: error
      - name: Release veröffentlichen
        if: startsWith(github.ref, 'refs/tags/schulradar-v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --title "Schulradar ${GITHUB_REF_NAME#schulradar-v}" --notes "PC: Schulradar-Setup-…exe (Installer) oder die portable Version. Handy (Android): Schulradar-…apk. Anleitung: siehe schulradar/README.md." || true
          gh release upload "$GITHUB_REF_NAME" dist/Schulradar-*.apk --clobber
